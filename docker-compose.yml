services:
  # Isolated LaTeX Compiler Microservice
  compiler:
    build:
      context: ./apps/compiler-service
      dockerfile: Dockerfile
    container_name: resumeforge-compiler
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - COMPILER_TIMEOUT=${COMPILER_TIMEOUT:-12}
      - MAX_INPUT_BYTES=2097152
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - resumeforge-net

  # Next.js Web Application
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    container_name: resumeforge-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - COMPILER_SERVICE_URL=http://compiler:8000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ADMIN_CONTACT_EMAIL=${ADMIN_CONTACT_EMAIL:-parmarramnik408@gmail.com}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    depends_on:
      compiler:
        condition: service_healthy
    networks:
      - resumeforge-net

networks:
  resumeforge-net:
    driver: bridge
